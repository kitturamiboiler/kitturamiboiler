<svg xmlns="http://www.w3.org/2000/svg" width="840" height="505" viewBox="0 0 840 505" fill="none" role="img" aria-labelledby="title desc"><title id="title">화면의 상태까지 구현</title><desc id="desc">Frontend에서 반응형 Home과 조회 실패·실제 0명 구분을 구현했습니다. 클릭하면 프론트엔드 저장소로 이동합니다.</desc><rect x="1" y="1" width="838" height="503" rx="18" fill="#FAFBFD" stroke="#E3E9F2"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"><text x="38" y="52" fill="#5076AB" font-size="22" font-weight="600">03 / INTERFACE</text><text x="38" y="99" fill="#182A44" font-size="34" font-weight="700">화면의 상태까지 구현</text><text x="38" y="163" fill="#233D60" font-size="27" font-weight="700">작은 화면에서 겹치던 Home</text><text x="38" y="205" fill="#41536C" font-size="24" font-weight="400">고정 좌표로 배치하던 HUD를 문서 흐름과 Grid 기반으로</text><text x="38" y="241" fill="#41536C" font-size="24" font-weight="400">바꾸고, 단일 /home에서 반응형 레이아웃을 구현했습니다.</text><text x="38" y="289" fill="#233D60" font-size="27" font-weight="700">조회 실패와 실제 0명 구분</text><text x="38" y="331" fill="#41536C" font-size="24" font-weight="400">실패를 정상 값인 0명으로 표시하던 fallback을 제거하고</text><text x="38" y="367" fill="#41536C" font-size="24" font-weight="400">loading·empty·error를 구분했습니다.</text><path d="M38 415H802" stroke="#E1E8F1"/><text x="38" y="452" fill="#315D99" font-size="25" font-weight="600">Frontend repository ↗</text></g></svg>
