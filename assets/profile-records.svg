<svg xmlns="http://www.w3.org/2000/svg" width="840" height="594" viewBox="0 0 840 594" fill="none" role="img" aria-labelledby="title desc"><title id="title">수치와 확인 범위</title><desc id="desc">2026년 8월 14일 프로젝트 기록 기준 Vitest 21개 파일 80개 테스트 통과. 5개 화면 크기 확인. 개인 작성 테스트 수나 실제 서비스 E2E 완료를 의미하지 않습니다.</desc><rect x="1" y="1" width="838" height="592" rx="18" fill="#FAFBFD" stroke="#E3E9F2"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"><text x="38" y="52" fill="#5076AB" font-size="22" font-weight="600">04 / VERIFIED RECORDS</text><text x="38" y="99" fill="#182A44" font-size="34" font-weight="700">수치와 확인 범위</text><text x="38" y="163" fill="#233D60" font-size="27" font-weight="700">80개 테스트 통과 · 21개 파일</text><text x="38" y="205" fill="#41536C" font-size="24" font-weight="400">Vitest 프로젝트 실행 기록입니다. 모두 제가 작성한</text><text x="38" y="241" fill="#41536C" font-size="24" font-weight="400">테스트라는 의미는 아닙니다.</text><text x="38" y="289" fill="#233D60" font-size="27" font-weight="700">5개 화면 크기 확인</text><text x="38" y="331" fill="#41536C" font-size="24" font-weight="400">정적 통합 fixture에서 Home·출석부의 가로 넘침, 패널</text><text x="38" y="367" fill="#41536C" font-size="24" font-weight="400">열기·닫기와 포커스 복귀 등을 확인했습니다.</text><text x="38" y="415" fill="#41536C" font-size="22" font-weight="400">1440×900 / 1024×768 / 844×390 / 390×844 / 320×568</text><path d="M38 461H802" stroke="#E1E8F1"/><text x="38" y="498" fill="#576B84" font-size="22" font-weight="400">2026.08.14 UI 통합 리팩토링 작업 기록 기준입니다. 실제 서비스</text><text x="38" y="532" fill="#576B84" font-size="22" font-weight="400">전체 E2E 완료나 사용자 대상 사용성 검증을 뜻하지 않습니다.</text></g></svg>
