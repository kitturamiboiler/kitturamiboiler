<svg xmlns="http://www.w3.org/2000/svg" width="840" height="756" viewBox="0 0 840 756" fill="none" role="img" aria-labelledby="title desc"><title id="title">OMAGOTCHI</title><desc id="desc">8인 팀 프로젝트에서 기수·출결·게이미피케이션 백엔드와 Home UI 구현을 담당했습니다.</desc><rect x="1" y="1" width="838" height="754" rx="18" fill="#FAFBFD" stroke="#E3E9F2"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"><text x="38" y="52" fill="#5076AB" font-size="22" font-weight="600">02 / FEATURED PROJECT</text><text x="38" y="99" fill="#182A44" font-size="34" font-weight="700">OMAGOTCHI</text><text x="38" y="163" fill="#41536C" font-size="24" font-weight="400">출석과 학습 기록을 캐릭터 성장으로 연결한 8인 팀</text><text x="38" y="199" fill="#41536C" font-size="24" font-weight="400">프로젝트입니다. 기수·출결·게이미피케이션과 Home·반응형 UI를</text><text x="38" y="235" fill="#41536C" font-size="24" font-weight="400">담당했습니다.</text><path d="M38 283H802" stroke="#E1E8F1"/><text x="38" y="320" fill="#233D60" font-size="27" font-weight="700">Backend</text><text x="38" y="362" fill="#233D60" font-size="27" font-weight="700">출결과 이벤트 사이의 누락</text><text x="38" y="404" fill="#41536C" font-size="24" font-weight="400">출결과 Outbox 이벤트를 같은 트랜잭션에 기록하고, 이벤트</text><text x="38" y="440" fill="#41536C" font-size="24" font-weight="400">발송 실패를 재처리하도록 구현했습니다.</text><text x="38" y="488" fill="#233D60" font-size="27" font-weight="700">재수신과 동시 요청의 중복 보상</text><text x="38" y="530" fill="#41536C" font-size="24" font-weight="400">수신 영수증·XP 원장·행 잠금·유니크 제약을 조합해 XP의 중복</text><text x="38" y="566" fill="#41536C" font-size="24" font-weight="400">반영을 막도록 구성했습니다.</text><text x="38" y="614" fill="#233D60" font-size="27" font-weight="700">시간에 따라 달라지는 출결 판정</text><text x="38" y="656" fill="#41536C" font-size="24" font-weight="400">출결 정책을 분리하고 Clock을 주입해 정시·지각·타임존 경계</text><text x="38" y="692" fill="#41536C" font-size="24" font-weight="400">조건을 테스트했습니다.</text></g></svg>
