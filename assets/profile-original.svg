<svg xmlns="http://www.w3.org/2000/svg" width="840" height="518" viewBox="0 0 840 518" fill="none" role="img" aria-labelledby="title desc"><title id="title">직접 만든 시로몽</title><desc id="desc">시로몽 캐릭터·픽셀 아트·애니메이션 저작권 등록 1건. 제C-2026-040776호. 팀 프로젝트 전체의 저작권을 의미하지 않습니다.</desc><rect x="1" y="1" width="838" height="516" rx="18" fill="#FAFBFD" stroke="#E3E9F2"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"><text x="38" y="52" fill="#5076AB" font-size="22" font-weight="600">07 / ORIGINAL WORK</text><text x="38" y="99" fill="#182A44" font-size="34" font-weight="700">직접 만든 시로몽</text><text x="38" y="163" fill="#41536C" font-size="24" font-weight="400">Figma로 화면을 설계하고 Aseprite로 캐릭터·픽셀</text><text x="38" y="199" fill="#41536C" font-size="24" font-weight="400">애니메이션을 제작했습니다.</text><text x="38" y="247" fill="#233D60" font-size="27" font-weight="700">저작권 등록 1건</text><text x="38" y="289" fill="#41536C" font-size="24" font-weight="400">시로몽 캐릭터·픽셀 아트·애니메이션</text><text x="38" y="337" fill="#315D99" font-size="26" font-weight="600">제C-2026-040776호</text><path d="M38 385H802" stroke="#E1E8F1"/><text x="38" y="422" fill="#576B84" font-size="22" font-weight="400">직접 제작한 시각 에셋의 저작권이며, 팀 프로젝트 전체를 의미하지</text><text x="38" y="456" fill="#576B84" font-size="22" font-weight="400">않습니다. 에셋의 재사용·재배포는 사전 문의해 주세요.</text></g></svg>
