<svg xmlns="http://www.w3.org/2000/svg" width="840" height="552" viewBox="0 0 840 552" fill="none" role="img" aria-labelledby="title desc"><title id="title">그 밖의 개발 경험</title><desc id="desc">Mini Dooray 4개 API 영역 구현과 Flip-Bot 개인 프로젝트.</desc><rect x="1" y="1" width="838" height="550" rx="18" fill="#FAFBFD" stroke="#E3E9F2"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"><text x="38" y="52" fill="#5076AB" font-size="22" font-weight="600">05 / MORE PROJECTS</text><text x="38" y="99" fill="#182A44" font-size="34" font-weight="700">그 밖의 개발 경험</text><text x="38" y="163" fill="#233D60" font-size="27" font-weight="700">Mini Dooray</text><text x="38" y="205" fill="#41536C" font-size="24" font-weight="400">Project·Project Member·Tag·Milestone 4개 영역의</text><text x="38" y="241" fill="#41536C" font-size="24" font-weight="400">서비스·Controller와 관련 테스트를 구현했습니다.</text><text x="38" y="289" fill="#41536C" font-size="24" font-weight="400">Front·Gateway 담당자와 API 계약을 맞춰 연동했습니다.</text><path d="M38 337H802" stroke="#E1E8F1"/><text x="38" y="374" fill="#233D60" font-size="27" font-weight="700">Flip-Bot</text><text x="38" y="416" fill="#41536C" font-size="24" font-weight="400">Python·discord.py 경제 시뮬레이션 봇을 개발했습니다.</text><text x="38" y="452" fill="#41536C" font-size="24" font-weight="400">사용자 자산·거래 기록을 관리하고 Railway 배포 오류를 로그로</text><text x="38" y="488" fill="#41536C" font-size="24" font-weight="400">확인했습니다.</text></g></svg>
